name: Python foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create environment and install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m pip install --no-build-isolation --no-deps -e .
          .venv/bin/python -m pip check
      - name: Lint, format and strict type checks
        run: |
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .
          .venv/bin/python -m mypy
      - name: Offline synthetic tests
        run: .venv/bin/python -m pytest --cov --cov-report=term-missing
      - name: Install local OCR engine for synthetic feasibility check
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-eng
          tesseract --version
      - name: Recognize synthetic scanned PDF with real Tesseract
        if: runner.os == 'Linux'
        env:
          BD_RUN_OCR: "1"
        run: .venv/bin/python -m pytest tests/integration/test_ocr.py -m ocr -v
